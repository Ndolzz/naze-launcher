name: Build Naze Launcher APK

# Runs automatically on every push to main, and can also be triggered manually
# from the Actions tab ("Run workflow" button) — no local Android Studio needed.
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      # ubuntu-latest no longer ships a usable preinstalled Gradle, so install
      # the exact Gradle version this project targets (AGP 8.5.2 needs 8.x).
      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # GitHub's ubuntu-latest runners ship a preinstalled, license-accepted
      # Android SDK that already includes the platform and build-tools this
      # project needs, so we use it directly and only fall back to sdkmanager
      # when a component is missing.
      - name: Set up Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          if [ -d "$ANDROID_HOME/platforms/android-34" ]; then
            echo "Using preinstalled Android platform 34"
          else
            yes | sdkmanager --licenses > /dev/null || true
            sdkmanager "platforms;android-34" "build-tools;34.0.0" > /dev/null
          fi

      # This repo doesn't ship a committed Gradle wrapper jar, so we bootstrap
      # one using the pinned Gradle installed above.
      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.7

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: naze-launcher-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
