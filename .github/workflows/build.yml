name: Build Naze Launcher APK

# Runs automatically on every push to main, and can also be triggered manually
# from the Actions tab ("Run workflow" button) — no local Android Studio needed.
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # This repo doesn't ship a committed Gradle wrapper jar, so we bootstrap one
      # using the Gradle that's preinstalled on GitHub's ubuntu-latest runners,
      # pinned to the version this project targets.
      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.7

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: naze-launcher-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
