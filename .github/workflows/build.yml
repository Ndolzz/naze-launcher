name: Build Naze Launcher APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Set up Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          if [ -d "$ANDROID_HOME/platforms/android-34" ]; then
            echo "Using preinstalled Android platform 34"
          else
            yes | sdkmanager --licenses > /dev/null || true
            sdkmanager "platforms;android-34" "build-tools;34.0.0" > /dev/null
          fi

      # Bootstrap a Gradle wrapper; if it fails, open an issue with the log tail
      # so the root cause is visible without access to Actions logs.
      - name: Generate Gradle wrapper
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          gradle wrapper --gradle-version 8.7 > wrapper.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            echo "gradle wrapper failed with exit code $code - opening diagnostic issue"
            { echo "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"; echo; echo '### Last 100 lines of gradle output'; echo; echo '```'; tail -n 100 wrapper.log; echo '```'; } > issue-body.md
            gh issue create --title "CI debug: gradle wrapper failed (run $GITHUB_RUN_NUMBER)" --body-file issue-body.md || true
          fi
          cat wrapper.log
          exit $code

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: naze-launcher-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
