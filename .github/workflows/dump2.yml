name: Dump files 2
on: [push, workflow_dispatch]
permissions:
  issues: write
  contents: read
jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dump base64
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p /tmp/d
          base64 -w0 app/src/main/java/com/naze/launcher/MainActivity.kt > /tmp/d/MA.b64
          base64 -w0 app/src/main/java/com/naze/launcher/NazeApplication.kt > /tmp/d/APP.b64
          base64 -w0 app/src/main/java/com/naze/launcher/theme/NazeTheme.kt > /tmp/d/TH.b64
          base64 -w0 app/src/main/java/com/naze/launcher/theme/ThemeEngine.kt > /tmp/d/TE.b64
          base64 -w0 app/src/main/AndroidManifest.xml > /tmp/d/MAN.b64
          base64 -w0 app/src/main/java/com/naze/launcher/onboarding/OnboardingScreen.kt > /tmp/d/OB.b64
          base64 -w0 app/src/main/java/com/naze/launcher/core/DeviceStatus.kt > /tmp/d/DS.b64
          for f in app/src/main/java/com/naze/launcher/storage/*.kt; do
            n=$(basename "$f" .kt)
            base64 -w0 "$f" > "/tmp/d/ST_${n}.b64"
          done
          for f in /tmp/d/*.b64; do
            n=$(basename "$f" .b64)
            echo "###${n}" >> /tmp/body.md
            cat "$f" >> /tmp/body.md
            echo "" >> /tmp/body.md
          done
          gh issue create --title "DUMP2" --body-file /tmp/body.md
