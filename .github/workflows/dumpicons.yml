name: Dump icons
on: [push, workflow_dispatch]
permissions:
  issues: write
  contents: read
jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dump base64 per file
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          base64 -w0 app/src/main/java/com/naze/launcher/ui/NazeIcons.kt > /tmp/a.b64
          gh issue create --title "ICONS" --body-file /tmp/a.b64
          base64 -w0 app/build.gradle.kts > /tmp/b.b64
          gh issue create --title "GRADLE" --body-file /tmp/b.b64
          if [ -f gradle/libs.versions.toml ]; then
            base64 -w0 gradle/libs.versions.toml > /tmp/c.b64
            gh issue create --title "TOML" --body-file /tmp/c.b64
          fi
