name: Dump build log
on: [push]
permissions:
  issues: write
  contents: read
jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build debug APK
        continue-on-error: true
        id: buildstep
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace 2>&1 | tee build.log
      - name: Dump log tail
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "### Build outcome: ${{ steps.buildstep.outcome }}"
            echo '--- last 45000 chars of build.log ---'
            tail -c 45000 build.log
          } > /tmp/body.md
          gh issue create --title "BUILD LOG DUMP 3" --body-file /tmp/body.md
