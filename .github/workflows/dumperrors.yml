name: Dump build errors
on: [push]
permissions:
  issues: write
  contents: read
jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build debug APK
        continue-on-error: true
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace 2>&1 | tee build.log
      - name: Dump errors
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          grep -n -B5 -A20 '^e: \|FAILURE\|error:' build.log | head -c 60000 > /tmp/body.md
          if [ ! -s /tmp/body.md ]; then cp build.log /tmp/body.md; fi
          gh issue create --title "BUILD ERROR DUMP 2" --body-file /tmp/body.md
